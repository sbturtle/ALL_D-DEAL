<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Chrome 내장 AI 분류 실험</title>
    <style>
      body {
        margin: 0 auto;
        max-width: 960px;
        padding: 16px;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        color: #1f2328;
        background: #ffffff;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        padding: 4px 8px;
        border-bottom: 1px solid #d0d7de;
        text-align: left;
      }
      pre {
        white-space: pre-wrap;
        font-size: 12px;
        background: #f6f8fa;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Chrome 내장 AI 카테고리 분류 실험</h1>
    <p>
      개발 서버 전용 실험 페이지입니다. 가짜 거래 설명 fixture만 기기 안의 Gemini Nano에 보내며,
      결과는 저장하지 않습니다.
    </p>
    <p id="status" role="status">준비 중</p>
    <ul id="availability"></ul>
    <button id="run" type="button" disabled>실험 시작</button>
    <h2>요약</h2>
    <ul id="summary"></ul>
    <h2>거래별 결과</h2>
    <table>
      <thead>
        <tr>
          <th>거래 설명</th>
          <th>기대</th>
          <th>키워드</th>
          <th>AI</th>
          <th>AI 정답</th>
          <th>ms</th>
        </tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
    <details>
      <summary>시스템 프롬프트</summary>
      <pre id="system-prompt"></pre>
    </details>
    <script type="module" src="/src/experiments/chrome-built-in-ai/runner.ts"></script>
  </body>
</html>
